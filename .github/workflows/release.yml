name: Release Build

env:
  PROGRAM_NAME: "zbProgram"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: 安装项目
        run: uv sync --all-extras --dev

      - name: 编译程序
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrEmpty($inputVersion)) {
            Write-Host "未指定版本号，使用当前版本号"
            uv run script\release_build.py
          } else {
            Write-Host "使用指定版本号: $inputVersion"
            uv run script\release_build.py -v "$inputVersion"
          }

      - name: 编译安装程序
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: script/setup.iss
          options: /O+

      - name: 校验构建输出
        id: check_output
        shell: pwsh
        run: |
          $out = Get-Content -Raw script\release_output.json | ConvertFrom-Json
          $version = $out.version
          $version_code = $out.version_code
          Write-Output "zip=$out.output" >> $env:GITHUB_OUTPUT
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "version_code=$version_code" >> $env:GITHUB_OUTPUT
          $notes = $out.release_notes -replace "`r`n", "`n"
          Write-Output "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: 提交版本更新
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -u
          if (-not (git diff --cached --quiet)) {
            git stash
            git pull --rebase origin main
            git stash pop
            git add -u
            git commit -m "Update version to ${{ steps.check_output.outputs.version }} (code ${{ steps.check_output.outputs.version_code }}) [ci skip]"
            git push origin main
          } else {
            Write-Host "无版本变更"
          }

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.check_output.outputs.version }}
          tag_name: ${{ steps.check_output.outputs.version }}
          files: |
            ${{ env.PROGRAM_NAME }}_${{ steps.check_output.outputs.version }}.zip
            ${{ env.PROGRAM_NAME }}_${{ steps.check_output.outputs.version }}_setup.exe
          body: ${{ steps.check_output.outputs.notes }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: 上传到 DUFS
        shell: pwsh
        env:
          DUFS_URL: ${{ secrets.DUFS_URL }}
          DUFS_USER: ${{ secrets.DUFS_USER }}
          DUFS_PASSWORD: ${{ secrets.DUFS_PASSWORD }}
        run: |
          $base = $Env:DUFS_URL.TrimEnd('/')
          $auth = "$($Env:DUFS_USER):$($Env:DUFS_PASSWORD)"

          curl --fail --silent --show-error --user $auth -T "index.json"     "$base/code/${{ env.PROGRAM_NAME }}/index.json"
          curl --fail --silent --show-error --user $auth -T "${{ env.PROGRAM_NAME }}_${{ steps.check_output.outputs.version }}.zip" "$base/code/${{ env.PROGRAM_NAME }}/${{ env.PROGRAM_NAME }}.zip"
          curl --fail --silent --show-error --user $auth -T "${{ env.PROGRAM_NAME }}_${{ steps.check_output.outputs.version }}_setup.exe" "$base/code/${{ env.PROGRAM_NAME }}/${{ env.PROGRAM_NAME }}_setup.exe"
